<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: blob:"
    />
    <title>Stick</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        box-sizing: border-box;
      }
      body {
        border: 2px solid #18181b;
        padding: 3px;
        background: #fafafa;
        cursor: grab;
        user-select: none;
      }
      body.dragging {
        cursor: grabbing;
      }
      #frame {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        border: 2px solid #18181b;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="frame">
      <canvas id="shot"></canvas>
    </div>
    <script type="module" src="./src/sticker.ts"></script>
  </body>
</html>
